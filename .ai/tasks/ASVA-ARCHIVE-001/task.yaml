intent:
  user_goal: "新增客户后原始资料完整且快速保存；AI自动整理并将有依据的未核实值写入Feishu Customers对应列；导师打开档案直接看到，不被长时间保存界面卡住"
  observable_success: "真实独立隔离环境从新建客户开始完整E2E；Customers物理字段/元数据和浏览器UI一致；失败可安全恢复、无多余失败Source；通过受控发布前置闸门"
  non_goals:
    - "本次审核不部署生产、不创建生产客户、不修改星野或任何历史真实客户"
    - "不重建Event Worker、数据库、消息队列或更换DeepSeek模型"
    - "不将AI待核实资料默认为人工已确认"
scope:
  allowed_paths:
    - ".ai/tasks/ASVA-ARCHIVE-001/"
