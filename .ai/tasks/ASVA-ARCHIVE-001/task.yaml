authorization:
  production_deploy_allowed: false
  production_write_allowed: false
  merge_allowed: false
requirements:
  - id: R001
    priority: must
    scenario: "管理员新增客户，填写原始备注与基础资料"
    given: "真实隔离Feishu环境、合法合成数据"
    when: "POST /api/customers 返回PERSISTED"
    then: "Customers原文与输入一致；客户ID稳定；任何AI失败不丢失原文"
    constraints:
      - "不得把Mock数据库等价为真实Feishu"
  - id: R002
    priority: must
    scenario: "用户点击新增客户保存"
    given: "网络、飞书服务处于被测实际条件"
    when: "客户主记录持久化"
    then: "用户立即看到保存成功，不等待DeepSeek；保存目标3s、验收门槛8s"
    constraints:
      - "附加文件保存需明确单独进度；不能把附件未存说成完整成功"
  - id: R003
    priority: must
    scenario: "保存后自动提取"
    given: "新增客户有明确原始资料"
    when: "客户端自动执行extract阶段"
    then: "DeepSeek基于该客户原文生成真实Source/Evidence，并且内容来源和人物归属可追溯"
    constraints:
      - "不得靠force重复调用模型作为普通恢复机制"
  - id: R004
    priority: must
    scenario: "Evidence准备就绪"
    given: "已存在同一sourceId/batchId的有效Evidence"
    when: "finalize阶段执行"
    then: "Proposal和合法的Customers物理字段真实落盘，confirmed=false且带Source/Evidence出处；不覆盖人工已确认字段"
    constraints:
      - "只读物理字段和元数据验收；中间表非空不算正式字段成功"
  - id: R005
    priority: must
    scenario: "导师打开新增客户档案"
    given: "AI完成finalize并已写入飞书"
    when: "浏览器从后端重新读取客户Profile"
    then: "前端主体展示困扰/目标/帮助期待与AI整理·待核实状态，且不显示过期缓存"
    constraints:
      - "必须真实浏览器验收，API返回成功不能代替UI"
  - id: R006
    priority: must
    scenario: "AI处理总耗时长于单次HTTP限额"
    given: "extract和finalize分离"
    when: "正常首轮无需force的新增客户处理"
    then: "每个HTTP阶段在实际网关与客户端时限内完成；超时可按已持久化Source/Evidence安全续跑"
    constraints:
      - "分别记录SAVE/EXTRACT/FINALIZE的端到端墙钟，不把77秒force旧数据耗时当正常新增"
  - id: R007
    priority: must
    scenario: "网络中断、浏览器关闭后重开、重复请求"
    given: "客户已有sourceId与batchId"
    when: "对同一operationId重发请求"
    then: "复用已有数据，不重复客户、Source、有效Evidence、Proposal和DeepSeek账单；可完成finalize"
    constraints:
      - "不允许对旧真实客户自动补偿"
  - id: R008
    priority: must
    scenario: "隔离实测报告出现二次Source自动归档FAIL"
    given: "已有合成客户的原始执行日志"
    when: "按customerId/sourceId/requestId追踪"
    then: "确认FAIL是否由旧调度或上传Source引起，证明不会导致额外AI调用、重复任务或真实用户资料丢失"
    constraints:
      - "未知的FAIL必须明确记录为阻断，不得忽略"
  - id: R009
    priority: must
    scenario: "研发候选待发布"
    given: "PR#56包含前后端变更，生产与Pages运行独立版本"
    when: "审核发布准备"
    then: "明确独立前后端发布补丁/版本、生产配置对照、回滚以及仅合成客户的Canary申请"
    constraints:
      - "本任务无生产部署/数据写入授权"
      - "禁止直接merge当前Draft PR"
  - id: R010
    priority: should
    scenario: "代码审阅与交接"
    given: "已提交tip 5764f8a"
    when: "新研发平台读取协议"
    then: "可以定位两个HTTP阶段、字段归档和测试入口，给出代码SHA与不确定项"
    constraints:
      - "绝不把源码审查等价为真实外部接口验证"
