    - fact: "源码实现两个独立 HTTP 阶段 extract 与 finalize，并保留 Customers 未核实字段来源元数据"
      source: "https://github.com/xiangshu3721/asva-workbench/commit/5764f8a2dc1a749e0b7c670ebd48e665697ab97a"
      verified_at: "2026-10-31"
